    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236c4bf4'/%3E%3Cstop offset='1' stop-color='%2300b3a4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cg fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'%3E%3Cpath d='M10 10.5v11'/%3E%3Cpath d='M22 10.5v11'/%3E%3Cpath d='M10 16h12'/%3E%3C/g%3E%3Ccircle cx='10' cy='8.5' r='2.6' fill='%23fff'/%3E%3Ccircle cx='22' cy='23.5' r='2.6' fill='%23fff'/%3E%3C/svg%3E"
    />
    <script>
      // 首帧前定色，避免主题闪烁；逻辑与 src/core/theme.ts 一致。
      try {
        var saved = localStorage.getItem('pphub.theme')
        document.documentElement.dataset.theme =
          saved === 'daylight' || saved === 'midnight'
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'midnight'
              : 'daylight'
      } catch (e) {
        /* 隐私模式下 localStorage 不可用：保留默认 daylight */
      }
    </script>
    <script type="module" crossorigin src="./assets/index-CQJeOHjR.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BaUi2m4o.css">
