[package]
name = "pphub"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "免安装、纯浏览器的 P2P 直连协作应用（单二进制，前端嵌入）"
repository = "https://github.com/qy527145/pphub"
authors = ["wmymz"]
# 前端产物 web/dist 编译期嵌入二进制；改动 web/ 后需 `npm --prefix web run build`。
include = ["/src/**", "/build.rs", "/web/dist/**", "/README.md", "/LICENSE"]

[package.metadata.wix]
upgrade-guid = "E5E198BD-BC1D-40DC-A129-1F6D2F63A387"
path-guid = "D6877C4E-92AC-4F5E-9E25-620EE6EFE38B"
license = false
eula = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
tower-http = { version = "0.6", features = ["cors", "trace"] }
clap = { version = "4", features = ["derive", "env"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
# 内置 STUN/TURN 服务器（UDP 打洞 + TURN over TCP 中继）
turn = "0.17"
getrandom = "0.2"
webrtc-util = "0.17"
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
